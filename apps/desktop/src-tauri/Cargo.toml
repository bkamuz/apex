[package]
name = "apex-desktop"
version = "0.1.0"
description = "Apex BIM desktop shell (Tauri 2)"
authors = ["Apex"]
edition = "2021"
license = "MIT"

[lib]
name = "apex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
