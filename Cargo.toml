[workspace]
resolver = "2"
members = [
    "crates/apex-core",
    "crates/apex-geometry",
    "crates/apex-wasm",
]
default-members = [
    "crates/apex-core",
    "crates/apex-geometry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Apex"]

[workspace.dependencies]
apex-core = { path = "crates/apex-core" }
apex-geometry = { path = "crates/apex-geometry" }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
lto = true
opt-level = "s"
