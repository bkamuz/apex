name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p apex-core -p apex-geometry

      - name: Clippy
        run: cargo clippy -p apex-core -p apex-geometry -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      # tsc runs as part of the build, which also catches bundling errors.
      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: MCP tests
        working-directory: packages/apex-mcp
        run: |
          npm ci
          npm test

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # The committed wasm package is what the smoke test exercises, so a stale
      # one is itself a failure worth catching.
      - name: Start dev server
        working-directory: apps/web
        run: |
          npm run dev -- --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          echo "dev server did not come up" >&2
          exit 1

      - name: Smoke test
        working-directory: apps/web
        env:
          APEX_SMOKE_URL: http://127.0.0.1:5173/
          APEX_SMOKE_OUT: ${{ github.workspace }}/smoke-screenshots
        run: node scripts/smoke.mjs

      - name: Camera controls test
        working-directory: apps/web
        env:
          APEX_SMOKE_URL: http://127.0.0.1:5173/
        run: node scripts/camera-controls-test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-screenshots
          if-no-files-found: ignore

  # Rebuilds the committed SMLib wasm from third_party/smlib and fails when it
  # differs, so the prebuilt apps/web/src/kernel/smlib/apex_smlib.{mjs,wasm}
  # cannot drift from the vendored sources.
  smlib-wasm:
    name: SMLib wasm reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - uses: actions/cache@v4
        with:
          path: third_party/smlib/build
          key: smlib-wasm-6.0.13-${{ hashFiles('third_party/smlib/**/*.cpp', 'third_party/smlib/**/*.h', 'third_party/smlib/build-wasm.sh') }}
      - name: Build SMLib wasm
        run: third_party/smlib/build-wasm.sh
      - name: Committed wasm is current
        run: git diff --stat --exit-code apps/web/src/kernel/smlib/
