# Build unsigned Tauri 2 desktop packages for Windows / Linux / macOS.
# Separate from .github/workflows/ci.yml so Rust/web/smoke stay fast.
#
# Artifacts (Actions tab, 14-day retention) vs GitHub Releases:
# - Push/PR/dispatch always upload apex-desktop-* Actions artifacts.
# - Tag push v* / desktop-v* (or dispatch with publish_draft) also creates a
#   GitHub Release on the repo Releases page with the installers attached.
name: Desktop

on:
  workflow_dispatch:
    inputs:
      publish_draft:
        description: 'After builds, create a draft GitHub Release with installers (testing; no production tag required)'
        type: boolean
        default: false
      draft_tag:
        description: 'Tag name for the draft release (e.g. draft-test-1). Used only when publish_draft is true; created if missing. Leave empty to use desktop-draft-<run_number>.'
        type: string
        default: ''
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'desktop-v*'
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ''
            rust_targets: ''
            bundle_path: apps/desktop/src-tauri/target/release/bundle

          - name: windows-arm64
            os: windows-11-arm
            args: ''
            rust_targets: ''
            bundle_path: apps/desktop/src-tauri/target/release/bundle

          - name: linux-x64
            os: ubuntu-22.04
            args: ''
            rust_targets: ''
            bundle_path: apps/desktop/src-tauri/target/release/bundle

          # Public GitHub-hosted ARM runner (straightforward aarch64).
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: ''
            rust_targets: ''
            bundle_path: apps/desktop/src-tauri/target/release/bundle

          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            bundle_path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle

          # Intel macOS: cross-compile from Apple Silicon (macos-13 Intel runners retired).
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            bundle_path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit / bundler deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache (desktop crate)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-${{ matrix.name }}

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install desktop CLI dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri app (unsigned)
        working-directory: apps/desktop
        # No signing secrets in MVP — see apps/desktop/README.md.
        # macOS uses ad-hoc identity "-" from tauri.conf.json.
        run: npm run tauri -- build ${{ matrix.args }}

      - name: List bundle outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${{ matrix.bundle_path }}" ]; then
            find "${{ matrix.bundle_path }}" -type f | sort
          else
            echo "No bundle directory at ${{ matrix.bundle_path }}"
          fi

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apex-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.bundle_path }}/deb/*.deb
            ${{ matrix.bundle_path }}/rpm/*.rpm
            ${{ matrix.bundle_path }}/appimage/*.AppImage
            ${{ matrix.bundle_path }}/msi/*.msi
            ${{ matrix.bundle_path }}/nsis/*.exe
            ${{ matrix.bundle_path }}/dmg/*.dmg
            ${{ matrix.bundle_path }}/macos/*.app
          if-no-files-found: error
          retention-days: 14

  # GitHub Releases page (not Actions artifacts). Tag push or draft dispatch.
  release:
    name: GitHub Release
    needs: build
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_draft }}" = "true" ]; then
            TAG="${{ inputs.draft_tag }}"
            if [ -z "$TAG" ]; then
              TAG="desktop-draft-${{ github.run_number }}"
            fi
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "name=Draft ${TAG}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apex-desktop-*
          path: release-assets

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f | sort
          # Fail early if nothing installer-like was produced.
          mapfile -t files < <(find release-assets -type f \( \
            -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o \
            -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installer files found under release-assets/"
            exit 1
          fi
          echo "Attaching ${#files[@]} installer file(s)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          draft: ${{ steps.meta.outputs.draft }}
          generate_release_notes: true
          # Some targets omit a format (e.g. no rpm); earlier step requires ≥1 installer.
          fail_on_unmatched_files: false
          # Installers only (skip raw .app bundles — use .dmg for macOS).
          files: |
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
